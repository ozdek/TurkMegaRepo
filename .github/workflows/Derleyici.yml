name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.jpg"
      - "**/*.png"

permissions:
  contents: write

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    steps:
      - name: "'src' Depo Kontrolü"
        uses: actions/checkout@v4
        with:
          path: "src"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "'build' Depo Kontrolü"
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK Ayarla
        uses: android-actions/setup-android@v3

      - name: Eklentileri Derle
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make --continue || true
          ./gradlew makePluginsJson || true
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds/ 2>/dev/null || true
          cp build/plugins.json $GITHUB_WORKSPACE/builds/ 2>/dev/null || true
          cp repo.json $GITHUB_WORKSPACE/builds/ 2>/dev/null || true

      - name: plugins.json ve repo.json Dosyalarını Güncelle
        run: |
          cd $GITHUB_WORKSPACE/builds
          python3 -c '
          import os, json, hashlib

          repo_name = os.getenv("GITHUB_REPOSITORY", "ozdek/TurkMegaRepo")
          plugins_file = "plugins.json"
          existing_plugins = {}
          if os.path.exists(plugins_file):
              try:
                  with open(plugins_file, "r", encoding="utf-8") as f:
                      for p in json.load(f):
                          existing_plugins[p.get("name")] = p
              except Exception:
                  pass

          # Find all .cs3 files and ensure they are indexed
          for f in sorted(os.listdir(".")):
              if f.endswith(".cs3"):
                  name = f.replace(".cs3", "")
                  size = os.path.getsize(f)
                  with open(f, "rb") as fp:
                      sha = hashlib.sha256(fp.read()).hexdigest()
                  
                  # Extract version from build.gradle.kts
                  version = 1
                  gradle_file = os.path.join(os.getenv("GITHUB_WORKSPACE", ""), "src", name, "build.gradle.kts")
                  if os.path.exists(gradle_file):
                      try:
                          with open(gradle_file, "r", encoding="utf-8") as gf:
                              for line in gf:
                                  if "version" in line and "=" in line:
                                      version = int(line.split("=")[1].strip())
                                      break
                      except Exception:
                          version = plugin_data.get("version", 1)
                  else:
                      version = plugin_data.get("version", 1)

                  plugin_data = existing_plugins.get(name, {})
                  plugin_data.update({
                      "url": f"https://raw.githubusercontent.com/{repo_name}/builds/{f}",
                      "status": plugin_data.get("status", 1),
                      "version": version,
                      "name": name,
                      "internalName": name,
                      "authors": plugin_data.get("authors", ["ozdek"]),
                      "description": plugin_data.get("description", f"{name} CloudStream eklentisi"),
                      "fileSize": size,
                      "repositoryUrl": f"https://github.com/{repo_name}",
                      "language": plugin_data.get("language", "tr"),
                      "apiVersion": plugin_data.get("apiVersion", 1),
                      "fileHash": f"sha256-{sha}"
                  })
                  existing_plugins[name] = plugin_data

          plugins_list = list(existing_plugins.values())
          with open(plugins_file, "w", encoding="utf-8") as f:
              json.dump(plugins_list, f, indent=4, ensure_ascii=False)

          # Ensure repo.json exists
          repo_json = {
              "name": "TurkMegaRepo",
              "description": "Türkçe içerikli eklenti havuzu",
              "manifestVersion": 1,
              "pluginLists": [
                  f"https://raw.githubusercontent.com/{repo_name}/builds/plugins.json"
              ]
          }
          with open("repo.json", "w", encoding="utf-8") as f:
              json.dump(repo_json, f, indent=2, ensure_ascii=False)
          '

      - name: Derlemeleri Yükle
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "Yeni Derleme: $GITHUB_SHA" || exit 0
          git push origin builds --force
